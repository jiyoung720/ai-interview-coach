# 경험 질문 루브릭 (설계 §6.2)
# 질문을 만들 때 그 질문이 볼 항목을 1~2개만 고정한다. 묻지 않은 항목으로 감점하지 않기 위해서다.
# 판정은 항목마다 observed / absent / not_applicable. 숫자 성과가 없어도 결과를 어떻게 확인했는지
# 정성적으로 말하면 outcome은 observed다.

items:
  - id: specificity
    name: 구체성
    observed_when: 무엇을 어떻게 했는지 대상과 방법이 드러난다 (어떤 데이터·도구·설정을 썼는지)
  - id: decision_basis
    name: 의사결정 근거
    observed_when: 왜 그렇게 했는지, 어떤 문제나 제약 때문이었는지 말한다
  - id: alternatives
    name: 대안·트레이드오프
    observed_when: 검토한 다른 방법과 그것을 고르지 않은 이유, 또는 선택으로 잃은 것을 말한다
  - id: outcome
    name: 결과·측정
    observed_when: 결과를 어떻게 확인했는지 말한다 (정량 지표든 정성적 확인이든)
