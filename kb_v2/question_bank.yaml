# 검수된 개념 질문 은행 (설계 §3.1)
# - question은 원문 그대로 출제한다
# - key_claims의 evidence는 evidence_doc 본문에 그대로 있어야 한다 (scripts/v2/check_data.py가 검사)
# - 토픽마다 기초(_01)와 심화(_02) 한 쌍. 기초 질문에 solid로 답하면 deeper로 심화 질문을 고른다

questions:
  # ------------------------------------------------------------ 임베딩과 유사도
  - id: embedding_similarity_01
    topic: embedding_similarity
    difficulty: basic
    question: "임베딩 기반 검색에서 코사인 유사도를 많이 쓰는 이유는 무엇이고, L2 거리와는 어떻게 다른가요?"
    kb_doc_ids: [embedding_similarity]
    key_claims:
      - claim_id: c1
        text: 코사인 유사도는 벡터의 크기와 관계없이 방향이 얼마나 비슷한지를 잰다
        evidence: "코사인 유사도는 두 벡터 사이 각도의 코사인 값으로, 벡터의 크기와 관계없이 방향이 얼마나 비슷한지를 잰다."
        evidence_doc: embedding_similarity
      - claim_id: c2
        text: L2 거리는 벡터의 크기에도 영향을 받는다
        evidence: "L2 거리는 두 벡터 끝점 사이의 직선거리라서 벡터의 크기에도 영향을 받는다."
        evidence_doc: embedding_similarity
      - claim_id: c3
        text: 벡터를 정규화하면 코사인과 L2는 같은 순위를 만든다
        evidence: "벡터를 길이 1로 정규화하면 코사인 유사도와 L2 거리는 같은 순위를 만든다."
        evidence_doc: embedding_similarity
    claim_followups:
      - {claim_id: c1, question: "코사인 유사도는 벡터의 어떤 성질을 비교하는 건가요?"}
      - {claim_id: c2, question: "L2 거리는 벡터의 길이가 다르면 어떤 영향을 받나요?"}
      - {claim_id: c3, question: "벡터를 정규화하면 코사인 유사도와 L2 거리의 검색 결과는 어떻게 되나요?"}
    deeper: [embedding_similarity_02]

  - id: embedding_similarity_02
    topic: embedding_similarity
    difficulty: intermediate
    question: "임베딩 검색이 전문용어가 많은 질문에서 엉뚱한 문서를 가져온다면, 원인과 대응은 무엇인가요?"
    kb_doc_ids: [embedding_similarity]
    key_claims:
      - claim_id: c1
        text: 임베딩 모델은 학습에서 보지 못한 전문용어나 드문 단어를 잘 구분하지 못할 수 있다
        evidence: "임베딩 모델이 학습 중에 보지 못한 전문용어나 드문 단어는 의미를 제대로 구분하지 못할 수 있다."
        evidence_doc: embedding_similarity
      - claim_id: c2
        text: 문서를 고쳐도 나아지지 않으면 임베딩 모델을 바꾸거나 키워드 검색을 함께 쓴다
        evidence: "이 경우 문서를 고쳐도 검색이 나아지지 않고, 임베딩 모델을 바꾸거나 키워드 검색을 함께 써야 한다."
        evidence_doc: embedding_similarity
      - claim_id: c3
        text: 임베딩 모델을 바꾸면 거리 임계값도 다시 정해야 한다
        evidence: "거리 값의 절대 크기는 임베딩 모델마다 다르므로, 모델을 바꾸면 거리 임계값도 다시 정해야 한다."
        evidence_doc: embedding_similarity
    claim_followups:
      - {claim_id: c1, question: "임베딩 모델이 특정 용어를 잘 구분하지 못하는 이유는 무엇일까요?"}
      - {claim_id: c2, question: "문서를 고쳐도 검색이 나아지지 않는다면 어떤 방법을 쓸 수 있나요?"}
      - {claim_id: c3, question: "임베딩 모델을 교체하면 기존에 정한 거리 기준은 그대로 써도 되나요?"}

  # ------------------------------------------------------------ chunking
  - id: chunking_01
    topic: chunking
    difficulty: basic
    question: "RAG에서 chunk 크기를 키우면 무엇이 좋아지고 무엇이 나빠지나요?"
    kb_doc_ids: [chunking]
    key_claims:
      - claim_id: c1
        text: chunk가 크면 문맥이 더 담겨 앞뒤 설명이 끊기지 않는다
        evidence: "chunk가 크면 한 chunk 안에 문맥이 더 많이 담겨, 답에 필요한 앞뒤 설명이 끊기지 않는다."
        evidence_doc: chunking
      - claim_id: c2
        text: chunk가 크면 관련 없는 내용이 섞여 검색 정밀도가 떨어진다
        evidence: "반면 chunk가 크면 관련 없는 내용이 함께 섞여 임베딩이 흐려지고 검색 정밀도가 떨어진다."
        evidence_doc: chunking
      - claim_id: c3
        text: chunk가 크면 토큰이 늘어 비용과 지연이 커진다
        evidence: "또 chunk가 크면 컨텍스트에 넣는 토큰이 늘어 비용과 지연이 커진다."
        evidence_doc: chunking
    claim_followups:
      - {claim_id: c1, question: "chunk가 크면 답변에 필요한 문맥 측면에서 어떤 이점이 있나요?"}
      - {claim_id: c2, question: "chunk가 커지면 검색 정밀도에는 어떤 영향이 있을까요?"}
      - {claim_id: c3, question: "chunk 크기는 비용이나 응답 속도와 어떤 관계가 있나요?"}
    deeper: [chunking_02]

  - id: chunking_02
    topic: chunking
    difficulty: intermediate
    question: "chunk를 나눌 때 overlap을 두는 이유와, 그 대가는 무엇인가요?"
    kb_doc_ids: [chunking]
    key_claims:
      - claim_id: c1
        text: overlap은 경계에서 잘린 내용이 양쪽 chunk에서 온전히 검색되게 한다
        evidence: "경계에서 잘린 문장이나 설명이 양쪽 chunk 어디에서든 온전히 검색되도록 하려는 것이다."
        evidence_doc: chunking
      - claim_id: c2
        text: overlap을 늘리면 중복 텍스트와 인덱스 크기가 늘어난다
        evidence: "overlap을 늘리면 경계 손실은 줄지만 저장하는 중복 텍스트와 인덱스 크기가 늘어난다."
        evidence_doc: chunking
    claim_followups:
      - {claim_id: c1, question: "overlap이 없으면 chunk 경계에서 어떤 문제가 생길 수 있나요?"}
      - {claim_id: c2, question: "overlap을 크게 잡으면 어떤 비용이 생기나요?"}

  # ------------------------------------------------------------ 하이브리드 검색과 reranking
  - id: hybrid_rerank_01
    topic: hybrid_rerank
    difficulty: basic
    question: "BM25 같은 키워드 검색과 벡터 검색은 각각 어떤 질문에 강한가요?"
    kb_doc_ids: [hybrid_rerank]
    key_claims:
      - claim_id: c1
        text: 키워드 검색(BM25)은 정확한 용어, 고유명사, 드문 전문용어에 강하다
        evidence: "그래서 정확한 용어, 고유명사, 드문 전문용어를 찾는 데 강하다."
        evidence_doc: hybrid_rerank
      - claim_id: c2
        text: 벡터 검색은 단어가 달라도 의미가 비슷한 문서를 찾는 데 강하지만 드문 용어는 놓칠 수 있다
        evidence: "벡터 검색은 단어가 달라도 의미가 비슷한 문서를 찾는 데 강하지만, 학습에서 드물었던 용어는 놓칠 수 있다."
        evidence_doc: hybrid_rerank
    claim_followups:
      - {claim_id: c1, question: "제품 모델명이나 에러 코드로 검색할 때는 어떤 검색 방식이 유리할까요?"}
      - {claim_id: c2, question: "사용자가 문서와 다른 표현으로 물어보면 어떤 검색 방식이 유리할까요?"}
    deeper: [hybrid_rerank_02]

  - id: hybrid_rerank_02
    topic: hybrid_rerank
    difficulty: intermediate
    question: "하이브리드 검색에서 두 검색 결과를 어떻게 합치는지, 그리고 그 뒤에 reranking을 붙이는 이유를 설명해 주세요."
    kb_doc_ids: [hybrid_rerank]
    key_claims:
      - claim_id: c1
        text: 두 검색의 점수 척도가 달라 점수 대신 순위를 합치는 방법을 자주 쓴다
        evidence: "두 검색의 점수는 척도가 달라 그대로 더하기 어렵기 때문에, 점수 대신 순위를 합치는 방법을 자주 쓴다."
        evidence_doc: hybrid_rerank
      - claim_id: c2
        text: cross-encoder는 질문과 문서를 함께 입력해 관련도를 직접 계산한다
        evidence: "bi-encoder는 질문과 문서를 따로 임베딩해 빠르게 비교하고, cross-encoder는 질문과 문서를 한 번에 입력해 관련도를 직접 계산한다."
        evidence_doc: hybrid_rerank
      - claim_id: c3
        text: cross-encoder는 느려서 1차 후보에만 적용한다
        evidence: "cross-encoder는 더 정확하지만 후보마다 모델을 돌려야 해서 느리므로, 전체 문서가 아니라 1차 후보에만 적용한다."
        evidence_doc: hybrid_rerank
    claim_followups:
      - {claim_id: c1, question: "키워드 검색 점수와 벡터 검색 점수를 그냥 더하면 어떤 문제가 있을까요?"}
      - {claim_id: c2, question: "bi-encoder와 cross-encoder는 질문과 문서를 처리하는 방식이 어떻게 다른가요?"}
      - {claim_id: c3, question: "cross-encoder를 전체 문서에 바로 적용하지 않는 이유는 무엇인가요?"}

  # ------------------------------------------------------------ RAG 파이프라인과 실패 유형
  - id: rag_pipeline_01
    topic: rag_pipeline
    difficulty: basic
    question: "RAG가 질문에 답하는 과정을 인덱싱 단계와 질의 단계로 나눠 설명해 주세요."
    kb_doc_ids: [rag_pipeline]
    key_claims:
      - claim_id: c1
        text: 인덱싱 단계에서 문서를 chunk로 나누고 임베딩해 저장한다
        evidence: "인덱싱 단계에서는 문서를 chunk로 나누고 임베딩해 저장한다."
        evidence_doc: rag_pipeline
      - claim_id: c2
        text: 질의 단계에서 질문을 임베딩해 가까운 chunk를 찾고 질문과 함께 프롬프트에 넣어 생성한다
        evidence: "질의 단계에서는 질문을 임베딩해 가까운 chunk를 찾고, 찾은 chunk와 질문을 프롬프트에 넣어 생성한다."
        evidence_doc: rag_pipeline
    claim_followups:
      - {claim_id: c1, question: "질문이 들어오기 전에 문서는 어떤 형태로 준비해 두나요?"}
      - {claim_id: c2, question: "질문이 들어오면 검색된 문서는 생성 단계에서 어떻게 쓰이나요?"}
    deeper: [rag_pipeline_02]

  - id: rag_pipeline_02
    topic: rag_pipeline
    difficulty: intermediate
    question: "RAG 답변이 틀렸을 때 원인을 어떻게 나눠서 찾나요?"
    kb_doc_ids: [rag_pipeline]
    key_claims:
      - claim_id: c1
        text: 검색 실패는 답이 있는 문서를 못 찾거나 관련 없는 문서를 상위로 가져오는 경우다
        evidence: "검색 실패는 답이 있는 문서를 찾지 못하거나 관련 없는 문서를 상위로 가져오는 경우다."
        evidence_doc: rag_pipeline
      - claim_id: c2
        text: 생성 이탈은 올바른 문서를 찾았는데도 컨텍스트에 없는 내용을 덧붙이거나 다르게 답하는 경우다
        evidence: "생성 이탈은 올바른 문서를 찾았는데도 LLM이 컨텍스트에 없는 내용을 덧붙이거나 컨텍스트와 다르게 답하는 경우다."
        evidence_doc: rag_pipeline
      - claim_id: c3
        text: 검색 지표와 생성 충실도를 따로 측정해야 고칠 곳을 알 수 있다
        evidence: "검색 실패와 생성 이탈은 원인이 달라서, 검색 지표와 생성 충실도를 따로 측정해야 어디를 고칠지 알 수 있다."
        evidence_doc: rag_pipeline
    claim_followups:
      - {claim_id: c1, question: "검색 단계에서 생기는 실패에는 어떤 모습이 있나요?"}
      - {claim_id: c2, question: "올바른 문서를 찾았는데도 답이 틀리는 경우는 어떤 상황인가요?"}
      - {claim_id: c3, question: "두 종류의 실패를 구분하려면 무엇을 측정해야 할까요?"}

  # ------------------------------------------------------------ structured output
  - id: structured_output_01
    topic: structured_output
    difficulty: basic
    question: "LLM 응답에 structured output을 쓰는 이유는 무엇인가요?"
    kb_doc_ids: [structured_output]
    key_claims:
      - claim_id: c1
        text: structured output은 응답이 정해진 스키마를 따르도록 강제한다
        evidence: "structured output은 응답이 정해진 스키마(필드 이름, 타입, 허용 값)를 따르도록 모델에 강제하는 기능이다."
        evidence_doc: structured_output
      - claim_id: c2
        text: 애플리케이션이 문자열 파싱 없이 필드를 바로 읽을 수 있다
        evidence: "그래서 애플리케이션은 문자열 파싱 없이 정해진 필드를 바로 읽을 수 있다."
        evidence_doc: structured_output
    claim_followups:
      - {claim_id: c1, question: "structured output을 쓰면 모델 응답에 어떤 제약이 생기나요?"}
      - {claim_id: c2, question: "자유 텍스트 응답과 비교하면 애플리케이션 코드 입장에서 무엇이 편해지나요?"}
    deeper: [structured_output_02]

  - id: structured_output_02
    topic: structured_output
    difficulty: intermediate
    question: "structured output을 쓰면 모델의 응답을 그대로 믿어도 되나요?"
    kb_doc_ids: [structured_output]
    key_claims:
      - claim_id: c1
        text: 스키마를 강제해도 형식이 맞을 뿐 내용이 맞다는 보장은 없다
        evidence: "스키마를 강제해도 형식이 맞는 것일 뿐, 내용이 사실이거나 논리적으로 맞다는 보장은 없다."
        evidence_doc: structured_output
      - claim_id: c2
        text: 값의 범위나 필드 사이 관계 같은 규칙은 코드로 따로 검증해야 한다
        evidence: "그래서 값의 범위나 필드 사이의 관계(예: 감점 합계와 점수의 일치) 같은 규칙은 코드로 따로 검증해야 한다."
        evidence_doc: structured_output
    claim_followups:
      - {claim_id: c1, question: "스키마에 맞는 응답이 나왔다면 그 내용도 정확하다고 볼 수 있나요?"}
      - {claim_id: c2, question: "형식이 맞는 응답에서도 따로 확인해야 하는 것은 무엇인가요?"}

  # ------------------------------------------------------------ 프롬프트 인젝션
  - id: prompt_injection_01
    topic: prompt_injection
    difficulty: basic
    question: "프롬프트 인젝션이 무엇이고, 왜 막기 어려운가요?"
    kb_doc_ids: [prompt_injection]
    key_claims:
      - claim_id: c1
        text: 입력이나 외부 데이터에 숨긴 지시문으로 LLM이 원래 지시를 무시하게 만드는 공격이다
        evidence: "프롬프트 인젝션은 사용자 입력이나 외부 데이터에 숨긴 지시문으로 LLM이 원래 지시를 무시하고 공격자의 의도대로 동작하게 만드는 공격이다."
        evidence_doc: prompt_injection
      - claim_id: c2
        text: LLM은 시스템 지시와 사용자 데이터를 같은 텍스트로 받아 근본적으로 구분하지 못한다
        evidence: "LLM은 시스템 지시와 사용자가 넣은 데이터를 같은 텍스트로 받기 때문에 둘을 근본적으로 구분하지 못한다."
        evidence_doc: prompt_injection
    claim_followups:
      - {claim_id: c1, question: "프롬프트 인젝션 공격은 어떤 방식으로 모델의 동작을 바꾸나요?"}
      - {claim_id: c2, question: "LLM이 시스템 지시와 사용자 입력을 구분하기 어려운 이유는 무엇인가요?"}
    deeper: [prompt_injection_02]

  - id: prompt_injection_02
    topic: prompt_injection
    difficulty: intermediate
    question: "RAG나 도구를 쓰는 애플리케이션에서 간접 프롬프트 인젝션을 어떻게 방어하나요?"
    kb_doc_ids: [prompt_injection]
    key_claims:
      - claim_id: c1
        text: 간접 인젝션은 LLM이 읽는 문서·검색 결과·도구 응답 안에 지시문이 숨어 있는 경우다
        evidence: "간접 인젝션은 LLM이 읽는 웹페이지, 문서, 검색 결과, 도구 응답 안에 지시문이 숨어 있는 경우다."
        evidence_doc: prompt_injection
      - claim_id: c2
        text: 완전히 막는 단일 방법은 없어 여러 겹으로 방어한다
        evidence: "프롬프트 인젝션을 완전히 막는 단일 방법은 없어서 여러 겹으로 방어한다."
        evidence_doc: prompt_injection
      - claim_id: c3
        text: 도구와 권한을 최소로 하고 되돌릴 수 없는 동작은 사람의 확인을 거친다
        evidence: "모델이 쓸 수 있는 도구와 권한을 최소로 하고, 되돌릴 수 없는 동작은 사람의 확인을 거치게 한다."
        evidence_doc: prompt_injection
    claim_followups:
      - {claim_id: c1, question: "사용자가 공격자가 아니어도 인젝션이 일어날 수 있는 경로는 무엇인가요?"}
      - {claim_id: c2, question: "프롬프트에 '지시를 따르지 마라'라고 쓰는 것만으로 충분할까요?"}
      - {claim_id: c3, question: "모델이 공격당했을 때 피해를 줄이려면 권한을 어떻게 설계해야 할까요?"}

  # ------------------------------------------------------------ tool calling
  - id: tool_calling_01
    topic: tool_calling
    difficulty: basic
    question: "LLM의 tool calling은 어떻게 동작하나요? 모델이 함수를 직접 실행하나요?"
    kb_doc_ids: [tool_calling]
    key_claims:
      - claim_id: c1
        text: 모델은 어떤 함수를 어떤 인자로 호출할지 구조화된 형태로 내놓는다
        evidence: "tool calling(function calling)은 LLM이 답을 바로 쓰는 대신, 미리 정의된 함수를 어떤 인자로 호출할지 구조화된 형태로 내놓는 기능이다."
        evidence_doc: tool_calling
      - claim_id: c2
        text: 모델은 함수를 직접 실행하지 않고 애플리케이션이 실행해 결과를 돌려준다
        evidence: "모델은 함수를 직접 실행하지 않고, 애플리케이션이 그 호출을 실행한 뒤 결과를 다시 모델에게 돌려준다."
        evidence_doc: tool_calling
      - claim_id: c3
        text: 모델은 도구 이름·설명·인자 스키마를 보고 판단하므로 도구 설명이 프롬프트 역할을 한다
        evidence: "모델은 함수 이름, 설명, 인자 스키마를 보고 언제 어떤 도구를 쓸지 판단하므로, 도구 설명이 사실상 프롬프트 역할을 한다."
        evidence_doc: tool_calling
    claim_followups:
      - {claim_id: c1, question: "tool calling에서 모델이 내놓는 출력은 어떤 형태인가요?"}
      - {claim_id: c2, question: "모델이 요청한 함수는 실제로 누가 실행하나요?"}
      - {claim_id: c3, question: "모델은 여러 도구 중 무엇을 쓸지 어떤 정보를 보고 정하나요?"}
    deeper: [tool_calling_02]

  - id: tool_calling_02
    topic: tool_calling
    difficulty: intermediate
    question: "에이전트가 도구를 잘못 부르거나 같은 도구를 계속 부를 때 어떻게 처리해야 하나요?"
    kb_doc_ids: [tool_calling]
    key_claims:
      - claim_id: c1
        text: 실행 전에 도구 이름과 인자를 검증해야 한다
        evidence: "모델은 존재하지 않는 도구를 부르거나 스키마에 맞지 않는 인자를 넣을 수 있으므로, 실행 전에 이름과 인자를 검증해야 한다."
        evidence_doc: tool_calling
      - claim_id: c2
        text: 호출 횟수 상한을 두고 상한에 걸리면 도구 없이 처리하는 경로로 돌아간다
        evidence: "같은 도구를 끝없이 반복 호출하지 않도록 호출 횟수 상한을 두고, 상한에 걸리면 도구 없이 처리하는 경로로 되돌아가야 한다."
        evidence_doc: tool_calling
      - claim_id: c3
        text: 도구 실행 범위는 모델의 인자가 아니라 애플리케이션이 허용한 권한으로 제한한다
        evidence: "도구가 실행할 수 있는 범위는 모델이 넘긴 인자가 아니라 애플리케이션이 허용한 권한으로 제한해야 한다."
        evidence_doc: tool_calling
    claim_followups:
      - {claim_id: c1, question: "모델이 없는 도구 이름이나 잘못된 인자를 보내면 어떻게 해야 하나요?"}
      - {claim_id: c2, question: "에이전트가 같은 도구를 계속 부르는 상황은 어떻게 끊어야 할까요?"}
      - {claim_id: c3, question: "모델이 넘긴 인자로 도구의 접근 범위가 넓어지지 않게 하려면 어떻게 해야 하나요?"}

  # ------------------------------------------------------------ LLM-as-a-judge와 편향
  - id: llm_judge_01
    topic: llm_judge
    difficulty: basic
    question: "LLM을 채점자로 쓸 때 알려진 편향에는 어떤 것들이 있나요?"
    kb_doc_ids: [llm_judge]
    key_claims:
      - claim_id: c1
        text: 위치 편향은 내용과 상관없이 앞이나 뒤의 답변을 더 좋게 판정하는 경향이다
        evidence: "위치 편향은 두 답변을 비교할 때 내용과 상관없이 앞이나 뒤에 놓인 답변을 더 좋게 판정하는 경향이다."
        evidence_doc: llm_judge
      - claim_id: c2
        text: 길이 편향은 길고 장황한 답변을 더 높게 평가하는 경향이다
        evidence: "길이 편향은 더 길고 장황한 답변을 내용과 상관없이 더 높게 평가하는 경향이다."
        evidence_doc: llm_judge
      - claim_id: c3
        text: 자기 선호 편향은 판정 모델이 자신이나 같은 계열 모델의 답변을 더 높게 평가하는 경향이다
        evidence: "자기 선호 편향은 판정 모델이 자신이나 같은 계열 모델이 생성한 답변을 더 높게 평가하는 경향이다."
        evidence_doc: llm_judge
    claim_followups:
      - {claim_id: c1, question: "두 답변을 나란히 놓고 비교하게 하면 어떤 편향이 생길 수 있나요?"}
      - {claim_id: c2, question: "답변의 길이는 LLM 채점에 어떤 영향을 줄 수 있나요?"}
      - {claim_id: c3, question: "채점 모델과 답변을 만든 모델이 같으면 어떤 문제가 생길 수 있나요?"}
    deeper: [llm_judge_02]

  - id: llm_judge_02
    topic: llm_judge
    difficulty: intermediate
    question: "LLM 채점 결과를 믿을 수 있는지 어떻게 확인하고, 편향은 어떻게 줄이나요?"
    kb_doc_ids: [llm_judge]
    key_claims:
      - claim_id: c1
        text: 판정이 사람의 판단과 얼마나 일치하는지 사람 라벨로 따로 확인해야 한다
        evidence: "다만 판정이 사람의 판단과 얼마나 일치하는지를 사람이 붙인 라벨로 따로 확인해야 믿을 수 있다."
        evidence_doc: llm_judge
      - claim_id: c2
        text: 순서를 바꿔 두 번 판정하고 일치할 때만 채택해 위치 편향을 줄인다
        evidence: "비교 평가에서는 두 답변의 순서를 바꿔 두 번 판정하고 결과가 일치할 때만 채택해 위치 편향을 줄인다."
        evidence_doc: llm_judge
      - claim_id: c3
        text: 평가 대상을 만든 모델과 다른 모델로 판정하면 자기 선호 편향을 줄인다
        evidence: "판정 모델은 평가 대상을 생성한 모델과 다른 모델을 쓰면 자기 선호 편향을 줄일 수 있다."
        evidence_doc: llm_judge
    claim_followups:
      - {claim_id: c1, question: "LLM 채점 결과가 믿을 만한지 무엇과 비교해 확인할 수 있나요?"}
      - {claim_id: c2, question: "답변 순서 때문에 생기는 편향은 평가 절차에서 어떻게 줄일 수 있나요?"}
      - {claim_id: c3, question: "채점에 쓸 모델은 어떤 기준으로 고르는 게 좋을까요?"}
