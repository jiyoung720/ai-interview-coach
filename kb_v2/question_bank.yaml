# 검수된 개념 질문 은행 (설계 §3.1)
# - question은 원문 그대로 출제한다
# - key_claims의 evidence는 evidence_doc 본문에 그대로 있어야 한다 (scripts/v2/check_data.py가 검사)
# - 토픽마다 기초(_01)와 심화(_02, 일부 _03). 기초 질문에 solid로 답하면 deeper로 심화 질문을 고른다
# - 채점에 영향을 주는 허용 기준은 주석이 아니라 also_accept 필드에 둔다 (주석은 Judge에 전달되지 않는다)
# - 핵심 주장은 "이 질문에 답하려면 꼭 말해야 하는 것"만 둔다. 경향은 경향으로, 흔한 구현은 예로 둔다
#   (조건을 정확히 말한 답이 감점되지 않게. Codex 사실 검토 반영)
# - 꼬리질문은 그 주장 하나만 확인하고, 묻는 내용과 채점 기준이 맞아야 한다

questions:
  # ------------------------------------------------------------ 임베딩과 유사도
  - id: embedding_similarity_01
    topic: embedding_similarity
    difficulty: basic
    question: "임베딩 기반 검색에서 코사인 유사도를 많이 쓰는 이유는 무엇이고, L2 거리와는 어떻게 다른가요?"
    kb_doc_ids: [embedding_similarity]
    key_claims:
      - claim_id: c1
        text: 코사인 유사도는 벡터의 크기와 관계없이 방향이 얼마나 비슷한지를 잰다
        evidence: "코사인 유사도는 두 벡터 사이 각도의 코사인 값으로, 벡터의 크기와 관계없이 방향이 얼마나 비슷한지를 잰다."
        evidence_doc: embedding_similarity
        also_accept:
          - "크기 차이를 빼고 방향만 비교하고 싶어서 코사인을 쓴다처럼, 코사인을 고르는 이유로 같은 성질을 설명한 답"
      - claim_id: c2
        text: L2 거리는 벡터의 크기에도 영향을 받는다
        evidence: "L2 거리는 두 벡터 끝점 사이의 직선거리라서 벡터의 크기에도 영향을 받는다."
        evidence_doc: embedding_similarity
    claim_followups:
      - {claim_id: c1, question: "코사인 유사도는 두 벡터의 어떤 점을 비교하나요?"}
      - {claim_id: c2, question: "두 벡터의 방향이 같고 길이만 다르면 L2 거리는 어떻게 되나요?"}
    deeper: [embedding_similarity_02, embedding_similarity_03]

  - id: embedding_similarity_02
    topic: embedding_similarity
    difficulty: intermediate
    question: "임베딩 검색이 전문용어가 들어간 질문에서 엉뚱한 문서를 가져온다면, 원인을 어떻게 찾고 어떻게 대응하나요?"
    kb_doc_ids: [embedding_similarity]
    key_claims:
      - claim_id: c1
        text: 검색 결과나 인덱스를 직접 확인해 원인을 좁힌다
        evidence: "먼저 상위 후보 조각을 직접 확인해 원인을 진단한다."
        evidence_doc: embedding_similarity
        also_accept:
          - "정답 문서가 인덱스에 들어 있는지 확인한다"
          - "같은 질의를 키워드 검색으로 돌려 결과를 비교한다"
      - claim_id: c2
        text: 원인에 맞는 대응을 하나 이상 고른다 (문서·질의 표현 보강, 조각 조정, 키워드 검색 결합, 모델 교체 등)
        evidence: "원인에 맞게 문서나 질의 표현 보강, 조각 크기 조정, 키워드 검색 결합, 임베딩 모델 교체 중 알맞은 방법을 고른다."
        evidence_doc: embedding_similarity
        also_accept:
          - "목록에 없더라도 진단한 원인에 맞는 기술적으로 타당한 대응"
    claim_followups:
      - {claim_id: c1, question: "엉뚱한 문서가 나왔을 때 원인을 좁히려면 무엇을 확인해 보겠어요?"}
      - {claim_id: c2, question: "원인이 드문 전문용어를 임베딩이 구분하지 못하는 것이라면 어떤 대응을 할 수 있나요?"}

  - id: embedding_similarity_03
    topic: embedding_similarity
    difficulty: intermediate
    question: "RAG에서 쓰던 임베딩 모델을, 기존 문서 벡터와 호환되지 않는 새 모델로 바꾸려면 무엇을 해야 하나요? 왜 그렇게 해야 하는지도 설명해 주세요."
    kb_doc_ids: [embedding_similarity]
    key_claims:
      - claim_id: c1
        text: 질문 벡터와 문서 벡터가 같은 벡터 공간에 있어야 비교할 수 있다
        evidence: "질문 벡터와 문서 벡터는 같은 벡터 공간에 있어야 거리를 의미 있게 비교할 수 있다."
        evidence_doc: embedding_similarity
        also_accept:
          - "질문과 문서를 같은 모델로 임베딩해야 한다 (DPR처럼 같은 공간에 맞춘 질문·문서 인코더 짝을 말해도 된다)"
      - claim_id: c2
        text: 검색 대상 문서를 새 모델로 다시 임베딩해 인덱스를 새로 만들거나 벡터를 교체한다
        evidence: "검색 대상 문서도 새 모델로 다시 임베딩해, 인덱스를 새로 만들거나 기존 인덱스의 벡터를 교체해야 한다."
        evidence_doc: embedding_similarity
    # 거리 임계값 재검증은 임계값을 쓰는 시스템에만 해당해서 필수 채점 항목에서 뺐다.
    claim_followups:
      - {claim_id: c1, question: "문서 벡터는 그대로 두고 질문만 새 모델로 임베딩해 검색하면 어떤 문제가 생기나요?"}
      - {claim_id: c2, question: "모델을 바꾼 뒤 저장된 문서 벡터와 검색 인덱스는 어떻게 처리하나요?"}

  # ------------------------------------------------------------ chunking
  - id: chunking_01
    topic: chunking
    difficulty: basic
    question: "RAG에서 청크 크기를 키우면 어떤 장점과 단점이 생길 수 있나요?"
    kb_doc_ids: [chunking]
    key_claims:
      - claim_id: c1
        text: 청크를 크게 하면 앞뒤 문맥을 더 많이 보존할 수 있다
        evidence: "chunk를 크게 하면 한 조각에 앞뒤 문맥을 더 많이 보존할 수 있다."
        evidence_doc: chunking
      - claim_id: c2
        text: 단점을 하나 이상 말한다 (여러 주제가 섞여 검색 품질이 떨어질 수 있음 등)
        evidence: "반면 한 조각에 여러 주제가 섞이면 임베딩이 흐려져 관련 조각을 정확히 찾는 검색 품질이 떨어질 수 있다."
        evidence_doc: chunking
        also_accept:
          - "같은 개수의 청크를 넣으면 입력 토큰이 늘어 비용과 지연이 커질 수 있다"
    claim_followups:
      - {claim_id: c1, question: "어떤 경우에 큰 청크가 답변에 더 도움이 되나요?"}
      - {claim_id: c2, question: "한 청크에 여러 주제가 섞이면 검색에는 어떤 영향이 있을 수 있나요?"}
    deeper: [chunking_02, chunking_03]

  - id: chunking_02
    topic: chunking
    difficulty: intermediate
    question: "문서를 청크로 나눌 때 인접한 청크를 일부 겹치게(overlap) 하는 이유는 뭔가요? 겹치는 구간이 길어지면 어떤 단점이 있나요?"
    kb_doc_ids: [chunking]
    key_claims:
      - claim_id: c1
        text: 경계에서 정보가 나뉘어 한 청크만으로는 문맥이 부족해지는 문제를 줄인다
        evidence: "overlap은 경계 근처의 내용이 두 조각으로 나뉘어, 한 조각만으로는 문맥이 부족해지는 문제를 줄이려는 설정이다."
        evidence_doc: chunking
      - claim_id: c2
        text: 저장·인덱싱 부담 증가나 비슷한 청크의 중복 검색 중 단점을 하나 이상 말한다
        evidence: "대가로 중복 텍스트가 늘어 저장 공간과 인덱싱 비용이 커지고, 비슷한 조각이 검색 결과에 함께 나올 수 있다."
        evidence_doc: chunking
    claim_followups:
      - {claim_id: c1, question: "overlap이 없으면 청크 경계에서 어떤 문제가 생길 수 있나요?"}
      - {claim_id: c2, question: "겹치는 구간을 크게 잡으면 저장이나 검색 결과에는 어떤 영향이 있을까요?"}

  - id: chunking_03
    topic: chunking
    difficulty: intermediate
    question: "작은 청크로 검색한 뒤, LLM에는 그 청크가 포함된 더 큰 문단을 넘긴다고 해볼게요. 이 방식의 장단점은 뭔가요?"
    kb_doc_ids: [chunking]
    key_claims:
      - claim_id: c1
        text: 검색은 작은 조각으로 정밀하게 하면서 답변에는 넓은 문맥을 주려는 절충이다
        evidence: "검색은 작은 조각으로 정밀하게 하면서 답변에는 넓은 문맥을 주려는 절충이다."
        evidence_doc: chunking
      - claim_id: c2
        text: 입력 증가, 담을 수 있는 근거 수 감소, 조각 관계 관리 같은 대가를 하나 이상 말한다
        evidence: "또 큰 조각을 넘기면 LLM 입력이 길어지거나, 같은 입력 길이 안에 담을 수 있는 근거 수가 줄 수 있다."
        evidence_doc: chunking
        also_accept:
          - "작은 조각과 큰 조각의 관계를 따로 저장하고 관리해야 한다"
    claim_followups:
      - {claim_id: c1, question: "검색용 청크와 LLM에 넘기는 단위의 크기를 다르게 두면 어떤 절충을 노리는 건가요?"}
      - {claim_id: c2, question: "더 큰 문단을 LLM에 넘기면 어떤 제약이 생기나요?"}

  # ------------------------------------------------------------ 하이브리드 검색과 reranking
  - id: hybrid_rerank_01
    topic: hybrid_rerank
    difficulty: basic
    question: "BM25 같은 키워드 검색과 벡터 검색은 각각 어떤 검색에 강한가요?"
    kb_doc_ids: [hybrid_rerank]
    key_claims:
      - claim_id: c1
        text: 키워드 검색은 정확한 용어·고유명사처럼 질문의 용어가 문서에 그대로 나와야 하는 검색에 강하다
        evidence: "키워드 검색은 정확한 용어, 고유명사, 에러 코드처럼 표현이 그대로 일치해야 하는 검색에 강하다."
        evidence_doc: hybrid_rerank
      - claim_id: c2
        text: 벡터 검색은 단어가 달라도 의미가 비슷한 문서를 찾는 데 강하다
        evidence: "벡터 검색은 단어가 달라도 의미가 비슷한 문서를 찾는 데 강하지만, 학습에서 드물었던 용어는 놓칠 수 있다."
        evidence_doc: hybrid_rerank
    claim_followups:
      - {claim_id: c1, question: "에러 코드나 제품 모델명으로 검색할 때는 어떤 검색 방식이 유리할까요?"}
      - {claim_id: c2, question: "같은 뜻을 문서와 다른 표현으로 물으면 어떤 검색 방식이 유리할까요?"}
    deeper: [hybrid_rerank_02]

  - id: hybrid_rerank_02
    topic: hybrid_rerank
    difficulty: intermediate
    question: "키워드 검색과 벡터 검색 결과는 어떻게 합치나요? 그리고 합친 후보에 리랭커(예: cross-encoder)를 적용하면 무엇이 좋아지고, 어떤 부담이 생기나요?"
    kb_doc_ids: [hybrid_rerank]
    key_claims:
      - claim_id: c1
        text: 점수를 정규화해 가중합하거나 순위를 합치는(예 RRF) 방법 중 하나로 결과를 합친다
        evidence: "두 검색의 점수는 척도가 달라 그대로 더하기 어렵기 때문에, 점수를 같은 범위로 정규화한 뒤 가중합하거나 각 결과 목록의 순위를 합치는 방법을 쓴다."
        evidence_doc: hybrid_rerank
        also_accept:
          - "점수 척도 차이를 말하지 않아도, 순위 기반 결합(RRF 등)이 어떻게 작동하는지 설명한 답"
      - claim_id: c2
        text: 리랭커는 1차 후보를 더 정교한 모델로 다시 평가해 상위 결과 품질을 높인다
        evidence: "reranking은 1차 검색이 가져온 후보를 더 정교한 모델로 다시 평가해 상위 결과의 품질을 높이려는 단계다."
        evidence_doc: hybrid_rerank
      - claim_id: c3
        text: 후보마다 모델을 돌려야 해서 계산 비용과 지연이 커진다
        evidence: "후보마다 모델을 돌려야 해서 비용과 지연이 크므로, 큰 문서 집합에서는 보통 1차 검색의 상위 후보에만 적용한다."
        evidence_doc: hybrid_rerank
    # c3에서 "상위 후보에만 적용한다"는 부담을 줄이는 방법이라 필수가 아니다.
    # MMR처럼 중복을 줄이는 재정렬은 KB에 있지만, 질문이 리랭커 "모델"과 그 부담을 물어서 채점 범위 밖이다.
    claim_followups:
      - {claim_id: c1, question: "두 검색 결과 목록에서 최종 순위를 어떻게 만드시겠어요?"}
      - {claim_id: c2, question: "1차 검색 뒤에 후보를 다시 평가하면 무엇이 좋아지나요?"}
      - {claim_id: c3, question: "리랭커에 넘기는 후보 수를 늘리면 어떤 부담이 생기나요?"}

  # ------------------------------------------------------------ RAG 파이프라인과 실패 유형
  - id: rag_pipeline_01
    topic: rag_pipeline
    difficulty: basic
    question: "RAG가 질문에 답하는 과정을 인덱싱 단계와 질의 단계로 나눠 설명해 주세요."
    kb_doc_ids: [rag_pipeline]
    key_claims:
      - claim_id: c1
        text: 인덱싱 단계에서 문서를 검색할 수 있는 형태로 준비한다 (벡터 임베딩이든 키워드 색인이든)
        evidence: "인덱싱 단계에서는 문서를 검색할 수 있는 형태로 준비한다."
        evidence_doc: rag_pipeline
      - claim_id: c2
        text: 질의 단계에서 질문과 관련된 자료를 인덱스에서 검색한다
        evidence: "질의 단계에서는 먼저 질문과 관련된 자료를 인덱스에서 검색한다."
        evidence_doc: rag_pipeline
      - claim_id: c3
        text: 검색한 자료를 근거로 프롬프트에 넣어 LLM이 답을 생성한다
        evidence: "그다음 검색한 자료를 근거로 프롬프트에 넣어 LLM이 답을 생성하게 한다."
        evidence_doc: rag_pipeline
    claim_followups:
      - {claim_id: c1, question: "질문이 들어오기 전에 문서는 어떻게 준비해 두나요?"}
      - {claim_id: c2, question: "사용자 질문이 들어오면, 준비해 둔 인덱스는 어떻게 쓰이나요?"}
      - {claim_id: c3, question: "검색한 자료는 답변을 만들 때 어떻게 쓰이나요?"}
    deeper: [rag_pipeline_02, rag_pipeline_03]

  - id: rag_pipeline_02
    topic: rag_pipeline
    difficulty: intermediate
    question: "원본 문서에는 정답 근거가 있는데 RAG 답변이 틀렸다면, 원인을 어떻게 나눠서 찾나요?"
    kb_doc_ids: [rag_pipeline]
    key_claims:
      - claim_id: c1
        text: 정답 근거가 검색 결과에 들어 있었는지 확인한다 (빠져 있으면 검색 단계 문제)
        evidence: "검색 실패는 답이 있는 자료를 찾지 못하거나 관련 없는 자료를 상위로 가져오는 경우다."
        evidence_doc: rag_pipeline
      - claim_id: c2
        text: 검색된 근거가 최종 컨텍스트에 실제로 들어갔는지 확인한다
        evidence: "검색 결과에는 있었지만 컨텍스트 길이 제한이나 후처리 때문에 최종 컨텍스트에서 빠지는 경우도 있다."
        evidence_doc: rag_pipeline
      - claim_id: c3
        text: 답에 필요한 근거가 최종 컨텍스트에 충분히 있었는데도 답이 어긋났다면 생성 단계 문제로 본다
        evidence: "생성 이탈은 필요한 근거가 최종 컨텍스트에 들어 있었는데도 LLM이 근거에 없는 내용을 덧붙이거나 근거와 다르게 답하는 경우다."
        evidence_doc: rag_pipeline
    # 세 주장은 단계별 확인 하나씩이다. 용어 정의를 외워 말할 필요는 없다.
    claim_followups:
      - {claim_id: c1, question: "틀린 답이 나왔을 때, 검색 단계가 원인인지는 어떻게 확인하나요?"}
      - {claim_id: c2, question: "검색 결과에는 정답 근거가 있었습니다. 답변을 분석하기 전에 무엇을 확인하시겠어요?"}
      - {claim_id: c3, question: "답에 필요한 근거가 최종 컨텍스트에 충분히 들어 있었는데 답이 틀렸다면, 어떤 문제로 볼 수 있나요?"}

  - id: rag_pipeline_03
    topic: rag_pipeline
    difficulty: intermediate
    question: "RAG가 LLM에 제공한 자료에 없는 내용을 답한다고 해볼게요. 프롬프트로 이 문제를 어떻게 줄일 수 있고, 어떤 한계가 있나요?"
    kb_doc_ids: [rag_pipeline]
    key_claims:
      - claim_id: c1
        text: 자료 안에서만 답하기, 모르면 모른다고 말하기, 관련 구절 먼저 뽑기, 근거 인용 같은 근거 제한 지시를 하나 이상 말한다
        evidence: "생성 단계에서는 제공한 자료 안에서만 답하게 하거나, 자료에 답이 없으면 모른다고 말하게 하거나, 답하기 전에 관련 구절을 먼저 뽑게 하거나, 답변의 주장마다 근거 자료를 인용하게 하는 지시를 쓸 수 있다."
        evidence_doc: rag_pipeline
        also_accept:
          - "목록에 없더라도 같은 목적(제공 자료에 근거하게 하기)의 유효한 프롬프트 지시"
      - claim_id: c2
        text: 지시는 지어낼 가능성을 줄일 수 있지만 없애지는 못한다
        evidence: "이런 지시는 근거에 없는 내용을 지어낼 가능성을 줄일 수 있지만 없애지는 못한다."
        evidence_doc: rag_pipeline
        also_accept:
          - "지시를 적용한 뒤에도 남는 오류의 구체적인 예를 든 답"
    # 근거 충실도 평가·인용 검증 같은 후속 확인은 KB에 있지만, 질문이 "한계"까지만 물어서 필수에서 뺐다.
    claim_followups:
      - {claim_id: c1, question: "모델이 자료 밖 내용을 덧붙이지 않게 하려면 프롬프트에 어떤 지시를 넣을 수 있나요?"}
      - {claim_id: c2, question: "그런 지시를 적용한 뒤에도 어떤 오류가 남을 수 있나요?"}

  # ------------------------------------------------------------ structured output
  - id: structured_output_01
    topic: structured_output
    difficulty: basic
    question: "LLM 응답에 structured output을 쓰는 이유는 무엇인가요?"
    kb_doc_ids: [structured_output]
    key_claims:
      - claim_id: c1
        text: 응답이 정해진 스키마를 따르도록 제약한다
        evidence: "structured output은 모델의 응답이 정해진 스키마(필드 이름, 타입, 허용 값 등)를 따르도록 제약하는 기능이다."
        evidence_doc: structured_output
      - claim_id: c2
        text: 자유 텍스트에서 값을 추출하는 부담이 줄어든다
        evidence: "그래서 자유 텍스트에서 원하는 값을 추출하는 부담이 줄고, SDK가 지원하면 응답을 바로 객체로 받을 수 있다."
        evidence_doc: structured_output
    claim_followups:
      - {claim_id: c1, question: "structured output을 쓰면 모델 응답에 어떤 제약이 생기나요?"}
      - {claim_id: c2, question: "자유 텍스트 응답과 비교하면 응답을 코드에서 쓸 때 무엇이 편해지나요?"}
    deeper: [structured_output_02]

  - id: structured_output_02
    topic: structured_output
    difficulty: intermediate
    question: "LLM이 structured output으로 스키마에 맞는 JSON을 돌려줬다면, 그 내용은 믿어도 되나요? 서비스에서 쓰기 전에 무엇을 더 검증해야 하나요?"
    kb_doc_ids: [structured_output]
    key_claims:
      - claim_id: c1
        text: 스키마는 형식과 일부 값 제약을 보장할 뿐 내용이 사실인지는 보장하지 않는다
        evidence: "스키마는 형식과 일부 값 제약(타입, 열거형, 숫자 범위 등)을 표현할 수 있지만, 내용이 사실인지나 근거가 맞는지는 보장하지 않는다."
        evidence_doc: structured_output
      - claim_id: c2
        text: 업무 규칙, 필드 사이 관계, 근거 대조 중 스키마 밖의 유효한 검증을 하나 이상 말한다
        evidence: "그래서 스키마로 표현할 수 없는 업무 규칙이나 필드 사이의 관계(예: 감점 합계와 점수의 일치), 근거의 정확성은 애플리케이션 코드에서 따로 검증한다."
        evidence_doc: structured_output
    claim_followups:
      - {claim_id: c1, question: "스키마 검증을 통과했다는 사실로 내용의 정확성을 어디까지 판단할 수 있나요?"}
      - {claim_id: c2, question: "형식이 맞아도 코드에서 따로 검증해야 하는 예를 하나 들어 주세요."}

  # ------------------------------------------------------------ 프롬프트 인젝션
  - id: prompt_injection_01
    topic: prompt_injection
    difficulty: basic
    question: "프롬프트 인젝션이 무엇이고, 왜 막기 어려운가요?"
    kb_doc_ids: [prompt_injection]
    key_claims:
      - claim_id: c1
        text: 입력이나 외부 데이터의 지시문 때문에 LLM이 의도한 지시를 벗어나 동작하게 되는 공격이다
        evidence: "프롬프트 인젝션은 사용자 입력이나 외부 데이터에 들어 있는 지시문 때문에 LLM이 개발자가 의도한 지시를 벗어나 동작하게 되는 공격이다."
        evidence_doc: prompt_injection
      - claim_id: c2
        text: 모델은 지시와 입력을 함께 읽고 판단해서 입력 속 문장도 지시처럼 작동할 수 있다
        evidence: "모델은 결국 두 입력을 함께 읽고 판단하기 때문에, 입력 안의 문장이 지시처럼 작동할 수 있다."
        evidence_doc: prompt_injection
        also_accept:
          - "시스템 지시와 사용자 입력을 따로 보내도 그 구분이 보안 경계가 되지 않는다"
          - "모델이 데이터와 지시를 안정적으로 구분하지 못한다"
    claim_followups:
      - {claim_id: c1, question: "프롬프트 인젝션은 어떤 방식으로 모델의 동작을 바꾸나요?"}
      - {claim_id: c2, question: "시스템 지시와 사용자 입력을 나눠 전달하면, 그 분리로 모델의 행동을 어디까지 제한할 수 있나요?"}
    deeper: [prompt_injection_02]

  - id: prompt_injection_02
    topic: prompt_injection
    difficulty: intermediate
    # 간접 인젝션의 정의는 질문 전제로 주고, 방어 조치만 채점한다.
    # 채점 기준이 도구 실행을 전제로 하므로 질문도 도구를 쓰는 에이전트로 좁혔다.
    question: "검색 문서를 읽고 도구도 실행할 수 있는 에이전트에서, 문서나 도구 응답 안에 지시문이 숨어 들어오는 간접 프롬프트 인젝션을 어떻게 방어하나요?"
    kb_doc_ids: [prompt_injection]
    key_claims:
      - claim_id: c1
        text: 외부 데이터가 권한을 부여하지 못하도록 실행 전에 코드에서 허용된 동작과 인자를 검사한다
        evidence: "외부 문서나 도구 응답은 신뢰할 수 없는 데이터로 다루고, 그 안의 문장이 권한을 부여할 수 없도록 실행 전에 애플리케이션 코드에서 허용된 동작과 인자를 검사한다."
        evidence_doc: prompt_injection
      - claim_id: c2
        text: 도구·권한을 최소로 하거나 위험한 동작은 사람의 확인을 거친다
        evidence: "모델이 쓸 수 있는 도구와 권한을 최소로 하고, 되돌릴 수 없거나 위험한 동작은 사람의 확인을 거치게 한다."
        evidence_doc: prompt_injection
    claim_followups:
      - {claim_id: c1, question: "모델이 문서 내용을 보고 도구 호출을 요청했다면, 그 호출을 실행할지는 무엇을 근거로 정해야 하나요?"}
      - {claim_id: c2, question: "처음부터 에이전트에 어떤 도구와 권한을 줄지, 어떤 작업에 추가 승인을 둘지는 어떻게 정하나요?"}

  # ------------------------------------------------------------ tool calling
  - id: tool_calling_01
    topic: tool_calling
    difficulty: basic
    question: "직접 정의한 함수를 LLM에 도구로 줄 때, tool calling은 어떻게 동작하나요? 모델이 함수를 직접 실행하나요?"
    kb_doc_ids: [tool_calling]
    key_claims:
      - claim_id: c1
        text: 모델은 어떤 함수를 어떤 인자로 호출할지 구조화된 요청을 내놓는다
        evidence: "사용자가 정의한 함수를 쓰는 tool calling에서, LLM은 답을 바로 쓰는 대신 어떤 함수를 어떤 인자로 호출할지 구조화된 요청을 내놓는다."
        evidence_doc: tool_calling
      - claim_id: c2
        text: 모델은 함수를 직접 실행하지 않고 애플리케이션(또는 SDK)이 실행해 결과를 돌려준다
        evidence: "애플리케이션(또는 SDK)이 그 요청을 실행하고 결과를 다시 모델에게 돌려준다."
        evidence_doc: tool_calling
    claim_followups:
      - {claim_id: c1, question: "tool calling에서 모델이 내놓는 출력에는 어떤 정보가 담기나요?"}
      - {claim_id: c2, question: "모델이 요청한 함수는 실제로 누가 실행하고, 결과는 어디로 가나요?"}
    deeper: [tool_calling_02]

  - id: tool_calling_02
    topic: tool_calling
    difficulty: intermediate
    question: "에이전트의 도구 호출에서 세 가지 상황을 가정해 볼게요. 도구 이름이나 인자가 잘못됐을 때, 권한 밖의 작업을 요청했을 때, 같은 호출을 반복해도 진전이 없을 때 각각 어떻게 처리하시겠어요?"
    kb_doc_ids: [tool_calling]
    key_claims:
      - claim_id: c1
        text: 실행 전에 도구 이름과 인자를 검증한다
        evidence: "모델은 존재하지 않는 도구를 부르거나 스키마에 맞지 않는 인자를 넣을 수 있으므로, 실행 전에 이름과 인자를 검증해야 한다."
        evidence_doc: tool_calling
      - claim_id: c2
        text: 도구의 실행 범위는 모델의 인자가 아니라 애플리케이션이 허용한 권한으로 제한한다
        evidence: "도구가 실행할 수 있는 범위는 모델이 넘긴 인자가 아니라 애플리케이션이 허용한 권한으로 제한해야 한다."
        evidence_doc: tool_calling
      - claim_id: c3
        text: 반복을 제한하는 장치를 두고, 걸리면 안전한 방식으로 처리한다 (중단·사유 안내·제한된 응답·사용자 확인 등)
        evidence: "같은 도구를 끝없이 반복 호출하지 않도록 호출 횟수 상한을 두고, 상한에 걸리면 중단하고 사유를 알리거나, 제한된 응답을 내거나, 사용자 확인을 받는 등 안전한 방식으로 처리한다."
        evidence_doc: tool_calling
        also_accept:
          - "호출 횟수 상한 대신 실행 시간 예산을 둔다"
          - "같은 호출이 진전 없이 반복되는지 감지해 끊는다"
    claim_followups:
      - {claim_id: c1, question: "모델이 없는 도구 이름이나 잘못된 인자를 보내면 어떻게 해야 하나요?"}
      - {claim_id: c2, question: "모델이 넘긴 인자 때문에 도구의 접근 범위가 넓어지지 않게 하려면 어떻게 해야 하나요?"}
      - {claim_id: c3, question: "같은 호출을 반복해도 작업이 진행되지 않으면, 어떻게 멈추고 그다음엔 어떻게 처리하시겠어요?"}

  # ------------------------------------------------------------ LLM-as-a-judge와 편향
  - id: llm_judge_01
    topic: llm_judge
    difficulty: basic
    question: "LLM을 채점자로 쓸 때 위치 편향, 길이 편향, 자기 선호 편향이 생길 수 있다고 하는데요. 각각 어떤 상황에서 나타나는지 예를 들어 설명해 주세요."
    kb_doc_ids: [llm_judge]
    key_claims:
      - claim_id: c1
        text: 위치 편향은 내용과 상관없이 앞이나 뒤의 답변을 더 좋게 판정하는 경향이다
        evidence: "위치 편향은 두 답변을 비교할 때 내용과 상관없이 앞이나 뒤에 놓인 답변을 더 좋게 판정하는 경향이다."
        evidence_doc: llm_judge
        also_accept:
          - "정의 대신 이 현상이 드러나는 예를 든 답 (예: 순서만 바꿨더니 판정이 뒤집힌다)"
      - claim_id: c2
        text: 길이 편향은 품질과 별개로 길이 자체가 평가에 영향을 주는 경향이다 (보통 긴 답변을 더 높게 평가)
        evidence: "길이 편향은 더 길고 장황한 답변을 내용과 상관없이 더 높게 평가하는 경향이다."
        evidence_doc: llm_judge
        also_accept:
          - "정의 대신 이 현상이 드러나는 예를 든 답 (예: 내용이 같은데 더 긴 답에 높은 점수를 준다)"
      - claim_id: c3
        text: 자기 선호 편향은 판정 모델이 자신이 생성한 답변을 더 높게 평가하는 경향이다
        evidence: "자기 선호 편향은 판정 모델이 자신이 생성한 답변을 더 높게 평가하는 경향이다."
        evidence_doc: llm_judge
        also_accept:
          - "정의 대신 이 현상이 드러나는 예를 든 답 (예: 같은 모델이 만든 답을 다른 모델 답보다 후하게 준다)"
    claim_followups:
      - {claim_id: c1, question: "내용은 그대로 두고 두 답변의 제시 순서만 바꿔 다시 평가하면, 어떤 결과를 우려하시겠어요?"}
      - {claim_id: c2, question: "답변의 길이는 LLM 채점에 어떤 영향을 줄 수 있나요?"}
      - {claim_id: c3, question: "채점 모델이 자기가 만든 답변을 채점하면 어떤 문제가 생길 수 있나요?"}
    deeper: [llm_judge_02]

  - id: llm_judge_02
    topic: llm_judge
    difficulty: intermediate
    question: "LLM 채점 결과를 믿을 수 있는지 어떻게 확인하고, 편향은 어떻게 줄이나요?"
    kb_doc_ids: [llm_judge]
    key_claims:
      - claim_id: c1
        text: 사람이 붙인 라벨과 얼마나 일치하는지 확인한다
        evidence: "판정을 믿으려면 사람이 붙인 라벨과 얼마나 일치하는지와, 같은 입력을 여러 번 판정했을 때 결과가 얼마나 흔들리는지를 따로 확인한다."
        evidence_doc: llm_judge
