# 검색 평가 주장 (B4에서 만들고 B7에서 쓴다). 설계 §7.8, §9.
# - 개념 답변(concept_cases.yaml)의 질문 밖 주장(side)을 하나씩 옮겼다. text는 답변 인용 그대로이고,
#   expected·group·expected_evidence_doc도 원래 값과 같아야 한다 (check_data가 대조한다).
# - expected_evidence_doc이 null이면 주장 전체가 "KB 근거 없음"이다. 개별 조각이 무관하다는 뜻이 아니다.
# - group은 같은 명제(같은 주장·의역·반대 주장)다. 예: 인용문이 자료에 있는지 확인(rag_quote_exists)과
#   출처를 달았으니 뒷받침된다(rag_citation_verify)는 다른 명제라 group을 나눈다.
# - 분할은 토픽이 아니라 group 단위이고, 같은 질문에서 나온 주장은 group이 달라도 같은 분할에 둔다 (설계 §9.1,
#   check_data가 확인). 임계값은 dev에서만 조정한다. holdout은 뒷받침·충돌·근거 없음이 모두 들어간 소규모 확인용이다.
# - 검색 대상은 KB 문서 본문이다 (frontmatter의 출처 제목은 색인하지 않는다). 그래서 출처 제목에만 이름이 있는
#   ParentDocumentRetriever 주장(ch_parent_impl)은 "KB 근거 없음"이다.
# - B7 조각 라벨에서는 expected_evidence_doc을 대표 문서로만 본다. 다른 문서의 조각도 판정할 수 있으면 근거로 인정한다
#   (예: 드문 용어는 embedding_similarity와 hybrid_rerank 양쪽, 최대 입력 길이는 embedding_similarity와 chunking 양쪽).
# - B7에서 첫 검색을 돌린 뒤, 인접하지만 판정할 수 없는 경계 주장과 저빈도 용어 주장(tags: [rare_term])을
#   source 없이 보강한다. 조각 단위 라벨(뒷받침 / 반박 / 관련 있지만 판정 불가)도 그때 붙인다.

