    question_id: tool_calling_02
    kind: side_wrong
    answer: "실행 전에 도구 이름과 인자를 검증하고, 실행 범위는 애플리케이션이 허용한 권한으로 제한합니다. 진전 없는 반복은 호출 횟수 상한을 두고, 걸리면 중단하고 사유를 알립니다. 참고로 ReAct는 도구를 쓰지 않고 추론만 반복하는 방식입니다."
