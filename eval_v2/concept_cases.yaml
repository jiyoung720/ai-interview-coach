    intended:
      core: {c1: met, c2: missing, c3: met}
      rationale: "검증과 반복 제한은 맞지만, 권한 밖 요청을 어떻게 막을지 말하지 않았다."

  - case_id: tc02_solid
    question_id: tool_calling_02
    kind: solid
    answer: "이름이나 인자가 틀리면 실행 전에 검증해서 걸러 냅니다. 권한 밖 요청은 모델이 넘긴 인자를 믿지 않고, 애플리케이션이 허용한 권한 범위 안에서만 도구가 실행되게 제한합니다. 같은 호출이 진전 없이 반복되면 호출 횟수 상한이나 실행 시간 예산으로 끊고, 사용자에게 사유를 알리거나 확인을 받습니다. 같은 도구를 여러 번 부르는 것 자체는 다음 페이지를 가져올 때처럼 정상일 수 있어서, 진전이 있는지를 봐야 합니다."
    intended:
