    answer: "모델은 함수를 직접 실행하지 않고, 어떤 함수를 어떤 인자로 부를지 구조화된 요청을 내놓습니다. 그러면 애플리케이션이나 SDK가 그 함수를 실제로 실행하고 결과를 다시 모델에게 넘겨서, 모델이 그 결과로 다음 답을 만듭니다. 모델은 함수 이름과 설명, 인자 스키마를 보고 도구를 고르기 때문에 설명을 명확히 써야 합니다."
