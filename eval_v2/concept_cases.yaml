      rationale: "짧지만 두 주장을 모두 말했다."

  - case_id: tc01_side_wrong
    question_id: tool_calling_01
    kind: side_wrong
    answer: "모델은 어떤 함수를 어떤 인자로 부를지 요청만 내놓고, 실제 실행은 애플리케이션이 해서 결과를 모델에게 돌려줍니다. 제공자가 주는 검색 같은 내장 도구도 항상 우리 애플리케이션이 실행합니다."
