  # ================================================================ tool_calling_01 (holdout)
  - case_id: tc01_missing
    question_id: tool_calling_01
    kind: missing
    answer: "LLM이 외부 기능을 쓸 수 있게 해 주는 기능이라고 알고 있습니다. 실제로 어떻게 동작하는지는 정확히 모르겠습니다."
    intended:
      core: {c1: missing, c2: missing}
      rationale: "모델의 출력도, 실행 주체도 말하지 않았다."

  - case_id: tc01_misconception
    question_id: tool_calling_01
    kind: misconception
    answer: "함수 코드를 모델에 같이 넘기면, 모델이 그 함수를 제공자 서버에서 직접 실행하고 결과까지 만들어서 답합니다."
    intended:
      core: {c1: missing, c2: wrong}
      rationale: "사용자 정의 함수를 모델이 직접 실행한다고 했다. 구조화된 호출 요청은 말하지 않았다."

