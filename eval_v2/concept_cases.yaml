          expected_evidence_doc: tool_calling
      rationale: "필수 주장은 맞지만, 내장 도구도 애플리케이션이 실행한다는 질문 밖 오류가 있다 (질문은 직접 정의한 함수만 묻는다)."

  # ================================================================ tool_calling_02 (holdout)
  - case_id: tc02_missing
    question_id: tool_calling_02
    kind: missing
    answer: "그런 상황은 직접 겪어 본 적이 없어서 어떻게 처리해야 할지 잘 모르겠습니다."
