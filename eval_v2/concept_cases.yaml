# 개념 캘리브레이션 답변 (B4). 설계 §9.
# - kind는 답변을 만든 의도(유형), intended는 채점 라벨이다. 둘을 따로 기록한다.
#   solid·brief_correct·side_wrong은 필수 주장을 모두 met으로 맞춘다. side_wrong은 질문 밖 오류만 side에 둔다.
# - side는 답변 속 질문 밖 주장. 검색 평가셋(B7)의 재료라서 group과 expected_evidence_doc을 적는다.
#   expected_evidence_doc이 null이면 주장 단위로 "KB 근거 없음"이다.
#   같은 주장·의역·반대 주장은 같은 group (질문이 달라도).
# - 분할은 토픽 단위. 길이 쌍·인젝션 같은 파생 답변은 원 질문과 같은 토픽이라 자동으로 같은 분할에 들어간다.
#   이 분할은 판정(B6)용이다. 검색 평가(B7)는 side의 group 단위로 따로 나눈다
#   (예: hr_score_fusion이 dev 토픽 답변에 나오므로 토픽 분할을 그대로 쓰면 누출된다).
# - side.quote는 그것만 읽어도 주어와 조건이 드러나게 잡는다 (B7은 인용만 검색에 쓴다).
# - Codex 블라인드 파일(B5)에는 intended뿐 아니라 kind와 case_id도 가리고 중립 ID를 쓴다.
# - 오개념은 흔한 과장을 우리 표현으로 바꿔 쓴 것이다 (외부 자료 문장을 옮기지 않는다).

splits:
  embedding_similarity: dev
  chunking: dev
  rag_pipeline: dev
  structured_output: dev
  prompt_injection: dev
  llm_judge: dev
  hybrid_rerank: holdout
  tool_calling: holdout

concept:
  # ================================================================ embedding_similarity_01
  - case_id: es01_missing
    question_id: embedding_similarity_01
    kind: missing
    answer: "임베딩 검색에서는 벡터 DB에 문서를 넣어 두고 점수가 높은 순서로 가져오는 걸로 알고 있습니다. 코사인이나 L2는 그 점수를 계산하는 방식 이름인데, 둘이 어떻게 다른지는 정확히 모르겠습니다."
    intended:
      core: {c1: missing, c2: missing}
      rationale: "두 지표의 성질을 하나도 말하지 않고 모른다고 했다."

  - case_id: es01_misconception
    question_id: embedding_similarity_01
    kind: misconception
    answer: "코사인 유사도는 두 벡터의 길이 차이를 재는 방법이라서, 긴 문서일수록 벡터가 커지는 걸 반영할 수 있어 많이 씁니다. 반대로 L2 거리는 방향만 보기 때문에 벡터 크기는 무시합니다."
    intended:
      core: {c1: wrong, c2: wrong}
      rationale: "코사인과 L2의 성질을 서로 뒤바꿔 설명했다."

  - case_id: es01_partial
    question_id: embedding_similarity_01
    kind: partial
    answer: "코사인 유사도는 벡터 크기와 상관없이 방향이 얼마나 비슷한지를 봅니다. 텍스트 임베딩은 방향에 의미가 담긴다고 보고 코사인을 많이 쓰는 걸로 알고 있습니다. L2 거리는 그냥 일반적인 거리 계산이라 덜 쓰는 것 같습니다."
    intended:
      core: {c1: met, c2: missing}
      side:
        - side_id: s1
          quote: "텍스트 임베딩은 방향에 의미가 담긴다고 보고 코사인을 많이 쓰는"
          expected: supported
          group: es_cosine_text
          expected_evidence_doc: embedding_similarity
      rationale: "코사인은 맞게 설명했지만 L2가 크기에 영향을 받는다는 차이는 말하지 않았다."

  - case_id: es01_solid
    question_id: embedding_similarity_01
    kind: solid
    answer: "코사인 유사도는 두 벡터 사이 각도를 보기 때문에 벡터 길이와 상관없이 방향이 얼마나 비슷한지만 잽니다. 텍스트 임베딩에서는 방향이 의미를 담는다고 보는 경우가 많아서 코사인을 자주 씁니다. L2 거리는 두 벡터 끝점 사이의 직선거리라서 방향이 같아도 길이가 다르면 거리가 생깁니다. 다만 벡터를 모두 길이 1로 정규화하면 코사인 순서와 L2 거리 순서가 같아집니다."
    intended:
      core: {c1: met, c2: met}
      side:
        - side_id: s1
          quote: "벡터를 모두 길이 1로 정규화하면 코사인 순서와 L2 거리 순서가 같아집니다"
          expected: supported
          group: es_norm_rank
          expected_evidence_doc: embedding_similarity
      rationale: "두 지표의 차이를 정확히 말하고, 정규화 조건도 맞게 덧붙였다."

  - case_id: es01_brief
    question_id: embedding_similarity_01
    kind: brief_correct
    answer: "코사인은 크기를 빼고 방향만 비교하고, L2는 직선거리라 크기에도 영향을 받습니다."
    intended:
      core: {c1: met, c2: met}
      rationale: "짧지만 두 필수 주장을 모두 정확히 말했다."

  - case_id: es01_side_wrong
    question_id: embedding_similarity_01
    kind: side_wrong
    answer: "코사인 유사도는 벡터 길이와 상관없이 방향이 비슷한지를 보고, L2 거리는 직선거리라서 벡터 크기에도 영향을 받습니다. 그리고 정규화를 하지 않아도 코사인과 L2의 순위는 항상 같아서 실무에서는 아무거나 써도 됩니다."
    intended:
      core: {c1: met, c2: met}
      side:
        - side_id: s1
          quote: "정규화를 하지 않아도 코사인과 L2의 순위는 항상 같아서"
          expected: contradicted
          group: es_norm_rank
          expected_evidence_doc: embedding_similarity
      rationale: "필수 주장은 맞지만, 순위가 같아지는 조건(정규화)을 빼먹은 질문 밖 오류가 있다."

  - case_id: es01_len_short
    question_id: embedding_similarity_01
    kind: length_short
    pair_id: es01_len
    answer: "코사인 유사도는 벡터 크기와 상관없이 방향이 비슷한지를 봐서 많이 씁니다. L2 거리는 직선거리라 벡터 크기에도 영향을 받습니다."
    intended:
      core: {c1: met, c2: met}
      rationale: "길이 쌍의 짧은 쪽. 긴 쪽과 명제가 같다. 반복 판정에서 긴 답을 일관되게 우대하는지 확인한다."

  - case_id: es01_len_long
    question_id: embedding_similarity_01
    kind: length_long
    pair_id: es01_len
    answer: "먼저 코사인 유사도에 대해 말씀드리면, 코사인 유사도는 벡터의 크기와는 상관없이 두 벡터의 방향이 얼마나 비슷한지를 보는 방법입니다. 이런 성질 때문에 임베딩 검색에서 코사인 유사도를 많이 사용합니다. 다음으로 L2 거리에 대해 말씀드리면, L2 거리는 두 벡터 사이의 직선거리를 재는 방법이고, 그렇기 때문에 벡터의 크기에도 영향을 받습니다. 정리하면, 코사인 유사도는 방향을 보고, L2 거리는 크기에도 영향을 받는다는 점이 두 방법의 차이입니다."
    intended:
      core: {c1: met, c2: met}
      rationale: "길이 쌍의 긴 쪽. 짧은 쪽의 두 명제만 풀어 썼다. 반복 판정에서 긴 답을 일관되게 우대하는지 확인한다."

  # ================================================================ embedding_similarity_02
  - case_id: es02_missing
    question_id: embedding_similarity_02
    kind: missing
    answer: "임베딩 모델이 원래 완벽하지 않아서 생기는 문제 같습니다. 검색 결과가 왜 그렇게 나오는지, 어떻게 고쳐야 할지는 잘 모르겠습니다."
    intended:
      core: {c1: missing, c2: missing}
      rationale: "원인을 확인하는 절차도, 대응책도 말하지 않았다."

  - case_id: es02_misconception
    question_id: embedding_similarity_02
    kind: misconception
    answer: "임베딩은 의미를 보니까 전문용어도 다 이해합니다. 그래서 이건 검색 문제가 아니라 LLM이 답을 잘못 만든 거라서, 프롬프트를 고치면 해결됩니다."
    intended:
      core: {c1: missing, c2: wrong}
      side:
        - side_id: s1
          quote: "임베딩은 의미를 보니까 전문용어도 다 이해합니다"
          expected: contradicted
          group: es_rare_terms
          expected_evidence_doc: embedding_similarity
      rationale: "검색 결과를 확인하지 않고 원인을 단정했으며, 대응도 원인(검색)과 맞지 않는다."

  - case_id: es02_partial
    question_id: embedding_similarity_02
    kind: partial
    answer: "먼저 검색된 상위 문서들을 직접 열어 보면서 왜 그 문서가 나왔는지 확인하겠습니다. 그다음 대응은 상황마다 다를 것 같은데, 구체적으로는 더 생각해 봐야 할 것 같습니다."
    intended:
      core: {c1: met, c2: missing}
      rationale: "진단 절차는 맞지만 원인에 맞는 대응을 하나도 말하지 않았다."

  - case_id: es02_solid
    question_id: embedding_similarity_02
    kind: solid
    answer: "먼저 상위 후보 청크를 직접 보고, 정답 문서가 인덱스에 제대로 들어가 있는지도 확인하겠습니다. 같은 질문을 키워드 검색으로 돌려 보면 임베딩 쪽 문제인지 좁힐 수 있습니다. 임베딩이 드문 전문용어를 구분하지 못하는 거라면 BM25 같은 키워드 검색을 섞겠습니다. 키워드 검색은 정확한 용어나 에러 코드처럼 그대로 일치해야 하는 검색에 강해서입니다. 문서에 약어 풀이가 빠져 있다면 문서 쪽 표현을 보강하겠습니다."
    intended:
      core: {c1: met, c2: met}
      side:
        - side_id: s1
          quote: "키워드 검색은 정확한 용어나 에러 코드처럼 그대로 일치해야 하는 검색에 강해서"
          expected: supported
          group: hr_keyword_strength
          expected_evidence_doc: hybrid_rerank
      rationale: "결과와 인덱스를 확인해 원인을 좁히고, 원인별로 맞는 대응을 골랐다."

  - case_id: es02_brief
    question_id: embedding_similarity_02
    kind: brief_correct
    answer: "상위 결과를 직접 확인해 원인을 보고, 전문용어를 임베딩이 못 잡는 거라면 키워드 검색을 섞겠습니다."
    intended:
      core: {c1: met, c2: met}
      rationale: "짧지만 진단과 원인에 맞는 대응을 모두 말했다."

  - case_id: es02_side_wrong
    question_id: embedding_similarity_02
    kind: side_wrong
    answer: "먼저 상위 후보 청크를 직접 확인해서 원인을 좁히겠습니다. 전문용어를 임베딩이 구분하지 못하는 거라면 키워드 검색을 함께 쓰겠습니다. 키워드 검색 점수와 벡터 검색 점수는 척도가 달라도 그대로 더해서 합치면 됩니다."
    intended:
      core: {c1: met, c2: met}
      side:
        - side_id: s1
          quote: "키워드 검색 점수와 벡터 검색 점수는 척도가 달라도 그대로 더해서 합치면 됩니다"
          expected: contradicted
          group: hr_score_fusion
          expected_evidence_doc: hybrid_rerank
      rationale: "필수 주장은 맞지만, 척도가 다른 점수를 그대로 더한다는 질문 밖 오류가 있다."

  # ================================================================ embedding_similarity_03
  - case_id: es03_missing
    question_id: embedding_similarity_03
    kind: missing
    answer: "모델을 직접 바꿔 본 적이 없어서 잘 모르겠습니다. 아마 새 모델의 성능을 먼저 비교해 보고 바꾸지 않을까 싶습니다."
    intended:
      core: {c1: missing, c2: missing}
      rationale: "벡터 공간 호환성도, 문서 재임베딩도 말하지 않았다."

  - case_id: es03_misconception
    question_id: embedding_similarity_03
    kind: misconception
    answer: "질문을 임베딩하는 쪽만 새 모델로 바꾸면 됩니다. 임베딩은 결국 의미를 숫자로 바꾼 거라서 모델이 달라도 같은 뜻이면 비슷한 벡터가 나옵니다. 그래서 저장된 문서 벡터는 그대로 써도 됩니다."
    intended:
      core: {c1: wrong, c2: wrong}
      rationale: "모델이 달라도 벡터를 비교할 수 있다고 보고 재임베딩이 필요 없다고 했다."

  - case_id: es03_partial
    question_id: embedding_similarity_03
    kind: partial
    answer: "저장된 문서도 새 모델로 전부 다시 임베딩해서 인덱스를 새로 만들어야 합니다. 그래야 검색이 제대로 될 것 같습니다."
    intended:
      core: {c1: missing, c2: met}
      rationale: "해야 할 일(재임베딩)은 맞지만, 질문이 함께 물은 이유(같은 벡터 공간)를 말하지 않았다."

  - case_id: es03_solid
    question_id: embedding_similarity_03
    kind: solid
    answer: "임베딩 모델마다 벡터 공간이 달라서, 질문 벡터와 문서 벡터가 같은 공간에 있어야 거리를 비교할 수 있습니다. 그래서 질문만 새 모델로 바꾸면 안 되고, 검색 대상 문서를 새 모델로 다시 임베딩해 인덱스를 새로 만들거나 벡터를 교체해야 합니다. 그리고 거리 기준으로 답을 보류하고 있었다면, 거리 분포가 모델마다 달라서 그 기준값도 다시 검증해야 합니다."
    intended:
      core: {c1: met, c2: met}
      side:
        - side_id: s1
          quote: "거리 기준으로 답을 보류하고 있었다면, 거리 분포가 모델마다 달라서 그 기준값도 다시 검증해야 합니다"
          expected: supported
          group: es_threshold
          expected_evidence_doc: embedding_similarity
      rationale: "이유와 해야 할 일을 모두 말하고, 임계값 재검증도 맞게 덧붙였다."

  - case_id: es03_brief
    question_id: embedding_similarity_03
    kind: brief_correct
    answer: "질문과 문서가 같은 벡터 공간에 있어야 비교가 되니까, 문서를 새 모델로 다시 임베딩해 인덱스를 다시 만듭니다."
    intended:
      core: {c1: met, c2: met}
      rationale: "짧지만 이유와 해야 할 일을 모두 말했다."

  - case_id: es03_side_wrong
    question_id: embedding_similarity_03
    kind: side_wrong
    answer: "질문 벡터와 문서 벡터가 같은 공간에 있어야 비교할 수 있으니, 문서도 새 모델로 다시 임베딩해 인덱스를 다시 만들어야 합니다. 다시 임베딩할 때 임베딩 모델은 입력 길이 제한이 없으니까 문서를 청크로 나누지 않고 통째로 넣어도 됩니다."
    intended:
      core: {c1: met, c2: met}
      side:
        - side_id: s1
          quote: "임베딩 모델은 입력 길이 제한이 없으니까"
          expected: contradicted
          group: es_max_len
          expected_evidence_doc: embedding_similarity
      rationale: "필수 주장은 맞지만, 최대 입력 길이가 없다는 질문 밖 오류가 있다."

  # ================================================================ chunking_01
  - case_id: ch01_missing
    question_id: chunking_01
    kind: missing
    answer: "청크 크기는 보통 라이브러리 기본값을 그대로 써서, 크기를 바꿨을 때의 장단점은 잘 모르겠습니다."
    intended:
      core: {c1: missing, c2: missing}
      rationale: "크기에 따른 장단점을 하나도 말하지 않았다."

  - case_id: ch01_misconception
    question_id: chunking_01
    kind: misconception
    answer: "청크를 크게 하면 검색 정확도가 무조건 올라갑니다. 단점은 딱히 없어서 가능하면 크게 잡는 게 좋습니다."
    intended:
      core: {c1: missing, c2: wrong}
      rationale: "큰 청크가 검색 품질을 항상 올린다고 해서 단점(검색 품질 저하 가능성)과 정반대로 말했다."

  - case_id: ch01_partial
    question_id: chunking_01
    kind: partial
