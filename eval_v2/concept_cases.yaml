  - case_id: hr02_solid
    question_id: hybrid_rerank_02
    kind: solid
    answer: "두 점수는 척도가 달라서 정규화해서 가중합하거나, RRF처럼 순위로 합칩니다. RRF에서 쓰는 상수 k는 가져오는 문서 수와는 다른 값입니다. 리랭커는 질문과 후보를 함께 넣어 관련도를 더 정교하게 다시 평가해서 상위 결과를 개선합니다. 대신 후보마다 모델을 돌려야 해서 계산 비용과 지연이 커지고, 그래서 보통 상위 후보에만 적용합니다."
