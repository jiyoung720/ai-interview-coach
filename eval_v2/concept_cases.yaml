          expected: supported
          group: tc_repeat_normal
          expected_evidence_doc: tool_calling
      rationale: "세 상황을 모두 맞게 처리하고, 정상적인 반복과 구분해야 한다는 점을 덧붙였다."

  - case_id: tc02_brief
    question_id: tool_calling_02
    kind: brief_correct
    answer: "실행 전에 이름과 인자를 검증하고, 실행 범위는 앱이 허용한 권한으로 묶고, 진전 없는 반복은 횟수 상한으로 끊어 사용자에게 알립니다."
    intended:
      core: {c1: met, c2: met, c3: met}
