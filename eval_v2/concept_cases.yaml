    answer: "잘못 불렀다면 모델이 다음 턴에 알아서 고치니까 일단 실행하게 두면 됩니다. 권한 밖 요청인지도 모델이 판단하게 하면 되고, 반복은 결국 모델이 스스로 멈추니까 따로 제한할 필요가 없습니다."
