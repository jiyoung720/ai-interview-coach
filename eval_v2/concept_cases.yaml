    question_id: hybrid_rerank_02
    kind: misconception
    answer: "키워드 점수와 벡터 점수를 그냥 더하면 됩니다. 리랭커는 결과를 무작위로 섞어서 다양하게 보여 주는 단계라서 비용은 거의 들지 않습니다."
