          expected: supported
          group: tc_tool_desc
          expected_evidence_doc: tool_calling
      rationale: "출력과 실행 흐름을 모두 말하고, 도구 설명의 중요성을 맞게 덧붙였다."

  - case_id: tc01_brief
    question_id: tool_calling_01
