name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1) 테스트: API 키가 필요 없는 계층만 검증한다.
  # 분기 로직과 그래프 구조는 순수 함수/구조라 Gemini 호출 없이 확인할 수 있어,
  # 비밀값을 CI에 노출하지 않고도 회귀를 잡을 수 있다.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -v

  # 2) Docker 빌드 + 이미지 배포: 검증을 통과한 이미지를 Docker Hub에 올린다.
  #
  # 빌드를 여기서 하는 이유: 러너가 네이티브 linux/amd64다.
  # 로컬 맥(arm64)에서 --platform linux/amd64로 빌드하면 QEMU 에뮬레이션을 타는데,
  # 임베딩 모델을 로드하는 단계에서 멈춰버려 실패했다(두 번 재현).
  # EC2에서 빌드하는 방법도 있지만 t3.small의 CPU/디스크를 배포 때마다 소모한다.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # main 푸시일 때만 로그인한다. PR에서는 빌드 검증만 하고 올리지 않는다
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ai-interview-coach:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # CUDA 스택이 다시 섞여 들어오면 이미지가 3배 이상 커지므로,
      # 최적화가 조용히 풀리지 않았는지 빌드 결과로 확인한다.
      # (실제로 처음 최적화 시도는 에러 없이 빌드됐지만 적용되지 않았던 전례가 있음)
      - name: Verify CPU-only torch
        run: |
          echo "=== 이미지 크기 ==="
          docker images ai-interview-coach:ci --format "{{.Size}}"

          echo "=== nvidia/triton 포함 여부 ==="
          COUNT=$(docker run --rm --entrypoint sh ai-interview-coach:ci -c \
            "ls /app/.venv/lib/python3.12/site-packages/ | grep -icE 'nvidia|triton' || true")
          echo "발견된 패키지 수: $COUNT"
          if [ "$COUNT" != "0" ]; then
            echo "::error::CPU 전용 torch 설정이 적용되지 않았습니다. CUDA 패키지가 이미지에 포함되어 있습니다."
            exit 1
          fi

      # 컨테이너가 실제로 기동해 헬스체크에 응답하는지 확인한다.
      # KB 인덱싱은 임베딩 모델만 쓰고 Gemini를 호출하지 않으므로 API 키 없이 가능하다.
      - name: Smoke test
        run: |
          docker run -d --name ci-app -p 8000:8000 -e GEMINI_API_KEY=dummy ai-interview-coach:ci

          # 최초 기동 시 KB 인덱싱(29 chunk)이 돌기 때문에 여유를 둔다
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "기동 확인 (${i}초)"
              curl -s http://127.0.0.1:8000/health
              docker rm -f ci-app > /dev/null
              exit 0
            fi
            sleep 1
          done

          echo "::error::컨테이너가 120초 안에 기동하지 않았습니다."
          docker logs ci-app
          docker rm -f ci-app > /dev/null
          exit 1

      # 여기까지 통과한 이미지만 올린다. 빌드가 됐다는 것과 실제로 뜬다는 것은 다르므로,
      # CUDA 검사와 스모크 테스트를 먼저 두고 그다음에 push한다.
      # latest 외에 커밋 SHA 태그도 함께 달아, 문제가 생기면 특정 커밋 이미지로 되돌릴 수 있게 한다.
      - name: Push to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/ai-interview-coach"
          docker tag ai-interview-coach:ci "$IMAGE:latest"
          docker tag ai-interview-coach:ci "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          echo "올린 이미지: $IMAGE:latest, $IMAGE:${{ github.sha }}"

  # 3) 배포(CD): EC2가 Docker Hub에서 이미지를 받아 재기동한다.
  # needs로 앞의 두 job에 의존시켜, 테스트와 빌드가 통과한 경우에만 배포된다.
  # PR에서는 실행되지 않고 main 브랜치 푸시에서만 동작한다.
  #
  # EC2는 더 이상 빌드하지 않는다. Docker Hub에서 완성된 이미지를 받아 띄우기만 하므로
  # 소스 코드도 필요 없고, 배포 시간과 디스크 사용량이 크게 줄어든다.
  deploy:
    needs: [test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # EC2에 필요한 건 compose 파일 하나뿐이다(.env는 비밀값이라 서버에 직접 둔다).
      # git pull로 소스 전체를 받던 것을 이 파일 전송으로 대체했다.
      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose-ec2.yml
          target: ~/ai-interview-coach/

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # 빌드가 사라져 pull만 하므로 이전(30m)보다 짧게 잡아도 된다
          command_timeout: 15m
          # 토큰이 스크립트에 직접 들어가면 프로세스 목록에 노출되므로 환경변수로 넘긴다.
          # GitHub Actions는 secret 값을 로그에서 자동으로 가린다.
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -e
            cd ~/ai-interview-coach

            # 저장소가 private이라 pull 전에 인증이 필요하다.
            # EC2에 수동으로 로그인해두는 대신 배포할 때마다 로그인하면,
            # 인스턴스를 새로 만들어도 별도 준비 없이 그대로 동작한다.
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            # 방금 CI가 올린 최신 이미지를 받아 교체한다
            docker compose -f docker-compose-ec2.yml pull
            docker compose -f docker-compose-ec2.yml up -d

            # 교체 후 참조가 끊긴 이전 이미지를 정리한다.
            # 이미지가 3GB 가까이 되어 쌓이면 EBS 20GB가 금방 찬다
            docker image prune -f

      # 배포된 서버가 실제로 응답하는지 외부에서 확인한다.
      # 배포 자체가 성공해도 컨테이너가 뜨지 않을 수 있으므로 별도 단계로 둔다.
      # 확인 대상은 `/`(데모 HTML)가 아니라 `/health`다. HTML은 정적 파일이라
      # 앱이 정상인지와 무관하게 응답할 수 있어 헬스체크로 적합하지 않다
      - name: Verify deployment
        run: |
          for i in $(seq 1 60); do
            if curl -sf "http://${{ secrets.EC2_HOST }}:8000/health" > /dev/null; then
              echo "배포 확인 (${i}초)"
              curl -s "http://${{ secrets.EC2_HOST }}:8000/health"
              exit 0
            fi
            sleep 5
          done

          echo "::error::배포 후 서버가 응답하지 않습니다."
          exit 1
