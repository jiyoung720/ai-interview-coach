# 미리 만든 프로필 (데모용). resume_span은 이력서 원문에 그대로 있어야 한다.
sample_id: sample_eval
summary: 상담 요약 LLM의 자동 평가 파이프라인과 API 비용 관리를 경험한 데이터 분석 인턴 출신
projects:
  - id: p1
    name: 상담 요약 품질 평가 파이프라인
    role: 데이터 분석 인턴
    tech: [Python, pandas, OpenAI API]
    outcomes:
      - 사람 채점 100건과 판정 일치율 비교
      - 길이 편향 완화 기준 추가 후 같은 100건으로 재확인
    resume_span: "LLM을 채점자로 쓰는 자동 평가를 도입하면서, 상담원 3명이 직접 채점한 100건과 비교해 판정 일치율을 확인했다."
  - id: p2
    name: LLM API 비용 대시보드
    role: 개인 프로젝트
    tech: [Python, SQL, Streamlit]
    outcomes:
      - 응답 캐시로 하루 API 호출 수 감소
    resume_span: "같은 질문이 반복되는 FAQ 봇에 응답 캐시를 붙여 하루 API 호출 수를 줄였다."
experience_questions:
  - id: eq1
    project_id: p1
    question: "채점 모델의 길이 편향을 발견한 뒤 무엇을 왜 바꿨고, 바꾼 뒤에는 어떻게 확인했나요?"
    rubric_items: [decision_basis, outcome]
    resume_span: "기준을 추가한 뒤 같은 100건으로 다시 비교해 판정 일치율이 올랐는지 확인했다."
  - id: eq2
    project_id: p1
    question: "채점 모델이 긴 요약을 더 높게 평가한다는 것은 구체적으로 어떻게 발견했나요?"
    rubric_items: [specificity]
    resume_span: "채점 모델이 긴 요약을 더 높게 평가하는 경향을 발견하고, 채점 기준에 길이로 점수를 올리지 말라는 항목을 추가했다."
  - id: eq3
    project_id: p2
    question: "FAQ 봇에 캐시를 붙이면서 고려한 다른 방법이나 감수한 점이 있나요?"
    rubric_items: [alternatives]
    resume_span: "같은 질문이 반복되는 FAQ 봇에 응답 캐시를 붙여 하루 API 호출 수를 줄였다."
