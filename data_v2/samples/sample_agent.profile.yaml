# 미리 만든 프로필 (데모용). resume_span은 이력서 원문에 그대로 있어야 한다.
sample_id: sample_agent
summary: 도구를 호출하는 일정 관리 에이전트와 이메일 요약 도우미를 만들며 실패 처리·안전성을 다룬 졸업 예정자
projects:
  - id: p1
    name: 일정 관리 에이전트
    role: 에이전트 설계 담당 (3인 팀)
    tech: [Python, LangGraph, Gemini API]
    outcomes:
      - 도구 이름·인자 사전 검증
      - 되돌릴 수 없는 동작에 사용자 확인
    resume_span: "모델이 없는 도구를 호출하거나 날짜 형식이 틀린 인자를 보내는 문제가 있어, 실행 전에 도구 이름과 인자를 검증하는 단계를 추가했다."
  - id: p2
    name: 이메일 요약 도우미
    role: 개인 프로젝트
    tech: [Python, Gemini API, Pydantic]
    outcomes:
      - 본문 격리와 출력 검증으로 인젝션 영향 감소
      - structured output으로 파싱 오류 제거
    resume_span: "이메일 본문에 \"이전 지시를 무시하라\" 같은 문장이 들어 있으면 요약이 엉뚱하게 바뀌는 것을 발견하고, 본문을 구분된 블록에 넣고 출력 형식을 코드로 검증하도록 바꿨다."
experience_questions:
  - id: eq1
    project_id: p1
    question: "일정 관리 에이전트에서 모델이 잘못된 도구 호출을 보낼 때 어떻게 처리했나요?"
    rubric_items: [specificity, decision_basis]
  - id: eq2
    project_id: p1
    question: "일정 삭제에 사용자 확인을 넣으면서 포기한 것은 무엇이고, 다른 방법은 검토했나요?"
    rubric_items: [alternatives]
  - id: eq3
    project_id: p2
    question: "이메일 요약 도우미에서 인젝션 대응이 효과가 있었는지는 어떻게 확인했나요?"
    rubric_items: [outcome]
