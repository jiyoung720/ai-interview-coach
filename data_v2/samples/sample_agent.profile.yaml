# 미리 만든 프로필 (데모용). resume_span은 이력서 원문에 그대로 있어야 한다.
sample_id: sample_agent
summary: 도구를 호출하는 일정 관리 에이전트와 이메일 요약 도우미를 만들며 실패 처리·안전성을 다룬 졸업 예정자
projects:
  - id: p1
    name: 일정 관리 에이전트
    role: 에이전트 설계 담당 (3인 팀)
    tech: [Python, LangGraph, Gemini API]
    outcomes:
      - 도구 이름·인자 사전 검증 추가
      - 일정 삭제 요청에 사용자 확인 적용
    resume_span: "모델이 없는 도구를 호출하거나 날짜 형식이 틀린 인자를 보내는 문제가 있어, 실행 전에 도구 이름과 인자를 검증하는 단계를 추가했다."
  - id: p2
    name: 이메일 요약 도우미
    role: 개인 프로젝트
    tech: [Python, Gemini API, Pydantic]
    outcomes:
      - 본문 격리와 출력 검증 적용, 테스트 이메일 20개로 공격 문장의 지시를 따르지 않는지 확인 (지시 준수 여부)
      - structured output 적용, 테스트 이메일 50개 모두 파싱 성공 확인 (형식만, 내용 정확성과는 별개)
    resume_span: "이메일 본문에 \"이전 지시를 무시하라\" 같은 문장이 들어 있으면 요약이 엉뚱하게 바뀌는 것을 발견하고, 본문을 구분된 블록에 넣고 출력 형식을 코드로 검증하도록 바꿨다."
experience_questions:
  - id: eq1
    project_id: p1
    question: "일정 관리 에이전트에서 모델이 잘못된 도구 호출을 보낼 때 구체적으로 어떻게 처리했고, 왜 그 방식을 택했나요?"
    rubric_items: [specificity, decision_basis]
    resume_span: "모델이 없는 도구를 호출하거나 날짜 형식이 틀린 인자를 보내는 문제가 있어, 실행 전에 도구 이름과 인자를 검증하는 단계를 추가했다."
  - id: eq2
    project_id: p1
    question: "일정 삭제에 사용자 확인을 넣으셨는데, 다른 방식과 비교했을 때의 차이나 사용자 확인을 넣으면서 감수한 점이 있었나요?"
    rubric_items: [alternatives]
    resume_span: "사용자 일정에 영향을 주는 삭제 요청은 사용자 확인을 받은 뒤에만 실행하도록 했다."
  - id: eq3
    project_id: p2
    question: "이메일 요약 도우미에서 인젝션 대응이 효과가 있었는지는 어떻게 확인했나요?"
    rubric_items: [outcome]
    resume_span: "같은 공격 문장을 넣은 테스트 이메일 20개로, 바꾼 뒤에는 요약이 공격 문장의 지시를 따르지 않는지 확인했다."
