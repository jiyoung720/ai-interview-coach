<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Interview Coach</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="toggles">
    <button id="theme-toggle" aria-label="테마 전환" title="라이트/다크 전환">◐</button>
  </div>

  <header>
    <div class="badge">RAG · LangGraph · Gemini</div>
    <h1>
      <!-- fill을 var(--accent)로 두어 다크 모드에서 밝은 틸로 함께 바뀐다 -->
      <svg class="logo" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <rect width="64" height="52" rx="14" fill="var(--accent)"/>
        <path d="M9 50 L9 64 L23 50 Z" fill="var(--accent)"/>
        <path d="M20.25 26 L28.25 34 L43.75 19" stroke="var(--accent-fg)" stroke-width="5.25" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      AI Interview Coach
    </h1>
    <p class="subtitle">이력서를 올리면 맞춤 면접 질문을 만들고, 답변을 평가해 코칭합니다.</p>
  </header>

  <main>
    <!-- STEP 1: 문서 업로드 -->
    <section class="card" id="step-upload">
      <div class="step-head"><span class="step-num">1</span><h2>문서 업로드</h2></div>
      <p class="hint">이력서·포트폴리오·프로젝트 README를 올리세요. (.md, .txt, .pdf)</p>
      <div class="upload-row">
        <input type="file" id="file-input" accept=".md,.txt,.pdf">
        <button id="upload-btn">업로드</button>
      </div>
      <div class="status" id="upload-status"></div>
    </section>

    <!-- STEP 2: 질문 생성 -->
    <section class="card disabled" id="step-questions">
      <div class="step-head"><span class="step-num">2</span><h2>면접 질문 생성</h2></div>
      <p class="hint">업로드한 문서에서 관심 주제를 검색해 질문을 만듭니다.</p>
      <div class="upload-row">
        <input type="text" id="query-input" placeholder="예: JWT 인증 경험, 프로젝트 트러블슈팅" value="프로젝트 기술 스택">
        <button id="generate-btn">질문 생성</button>
      </div>
      <div class="status" id="generate-status"></div>
      <ul class="question-list" id="question-list"></ul>
    </section>

    <!-- STEP 3: 멀티턴 면접 -->
    <section class="card disabled" id="step-interview">
      <div class="step-head">
        <span class="step-num">3</span>
        <h2>면접 진행</h2>
        <span class="turn-badge" id="turn-badge" hidden></span>
      </div>
      <p class="hint" id="interview-hint">위에서 질문을 선택하세요.</p>

      <!-- 턴이 쌓이는 대화 타임라인 -->
      <div id="timeline"></div>

      <!-- 현재 답해야 할 질문 (세션 진행 중에만 보임) -->
      <div class="current-question" id="current-question" hidden></div>

      <div id="answer-area">
        <textarea id="answer-input" placeholder="답변을 입력하세요..." rows="5"></textarea>
        <div class="answer-actions">
          <!-- 남은 턴을 채우지 않고 중간에 끝낼 수 있는 유일한 출구 -->
          <button id="end-session-btn" class="secondary" hidden>면접 종료</button>
          <button id="submit-btn">면접 시작</button>
        </div>
      </div>

      <div class="status" id="interview-status"></div>

      <!-- 고정 지식에 근거가 없어 채점을 보류했을 때 (Phase 17).
           이어갈지 끝낼지는 사용자가 정한다 -->
      <div class="session-end" id="scope-choice" hidden>
        <p id="scope-message"></p>
        <button id="scope-continue-btn">다른 질문으로 계속하기</button>
        <button id="scope-end-btn" class="secondary">면접 종료</button>
      </div>

      <!-- 세션 종료 안내 -->
      <div class="session-end" id="session-end" hidden>
        <p id="end-message"></p>
        <button id="summary-btn" class="secondary">요약 다시 보기</button>
        <button id="restart-btn">다른 질문으로 다시 시작</button>
      </div>
    </section>
  </main>

  <!-- 면접이 끝나면 전체를 한 화면에서 되짚어 볼 수 있게 하는 요약.
       타임라인은 위아래로 길어서 흐름과 총평이 한눈에 안 들어온다 -->
  <div class="modal-backdrop" id="summary-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="summary-title">
      <div class="modal-head">
        <h3 id="summary-title">모의 면접 요약</h3>
        <button id="summary-close" class="icon-btn" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-body" id="summary-body"></div>
      <div class="modal-foot">
        <button id="summary-close-btn" class="secondary">닫고 기록 보기</button>
        <button id="summary-restart-btn">다른 질문으로 다시 시작</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
