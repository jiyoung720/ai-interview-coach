services:
  app:
    build: .
    image: ai-interview-coach:latest
    ports:
      - "8000:8000"
    # 비밀값을 이미지에 굽지 않고 런타임에 주입한다 (.env는 .dockerignore로 제외돼 있음)
    env_file:
      - .env
    environment:
      # 이 파일은 제작자 노트북에서 쓰는 로컬 실행용이다. 공개 서버는 docker-compose-ec2.yml(demo).
      - APP_MODE=local
    volumes:
      # 벡터 인덱스와 앱 데이터(세션·예산 DB, 업로드 파일)를 컨테이너 밖에 보존.
      - chroma_data:/app/chroma_db
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      # 최초 기동 시 KB 인덱싱이 돌 수 있어 시작 유예를 넉넉히 준다
      start_period: 120s
      retries: 3
    restart: unless-stopped

volumes:
  chroma_data:
  app_data:
